<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Sprites</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="top-bar">
    <h1>Claude Sprites</h1>
    <span id="project-name">No project loaded</span>
    <span id="connection-status" class="disconnected">Disconnected</span>
  </header>

  <div id="workspace">
    <aside id="left-panel">
      <section id="tool-palette">
        <h2>Tools</h2>
        <div id="tool-buttons"></div>
      </section>
      <section id="color-palette">
        <h2>Palette</h2>
        <div id="active-color">
          <div id="active-color-swatch"></div>
          <span id="active-color-name">—</span>
        </div>
        <div id="palette-swatches"></div>
      </section>
    </aside>

    <main id="center-panel">
      <div id="canvas-container">
        <canvas id="editor-canvas"></canvas>
      </div>
      <div id="canvas-info">
        <span id="cursor-pos">—</span>
        <span id="zoom-level">1x</span>
        <span id="cell-ref">—</span>
      </div>
    </main>

    <aside id="right-panel">
      <section id="shape-list">
        <h2>Shapes</h2>
        <ul id="shape-items"></ul>
      </section>
      <section id="group-panel">
        <h2>Groups</h2>
        <ul id="group-items"></ul>
      </section>
    </aside>
  </div>

  <footer id="bottom-bar">
    <div id="cell-strip"></div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
